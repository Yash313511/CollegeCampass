<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 136" width="100%" height="100%">
  <defs>
    <linearGradient id="icon-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0044CC" />
    </linearGradient>
    <linearGradient id="icon-needle-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0055EE" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 3)">
    <!-- North Pointer -->
    <polygon points="68,8 60,38 76,38" fill="#0066FF" />
    <polygon points="68,8 68,38 60,38" fill="#0088FF" />
    <polygon points="68,8 76,38 68,38" fill="#0044CC" />

    <!-- South Pointer -->
    <polygon points="68,122 60,92 76,92" fill="#0044CC" />
    <polygon points="68,122 68,92 60,92" fill="#0055EE" />
    <polygon points="68,122 76,92 68,92" fill="#003399" />

    <!-- West Pointer -->
    <polygon points="10,65 38,57 38,73" fill="#0077FF" />
    <polygon points="10,65 38,57 38,65" fill="#0099FF" />
    <polygon points="10,65 38,73 38,65" fill="#0055EE" />

    <!-- East Point (Behind C gap) -->
    <polygon points="126,65 98,58 98,72" fill="#0066FF" opacity="0.8" />

    <!-- Outer 'C' Dynamic Curved Arc -->
    <path d="M 98,35 A 44 44 0 1 0 98,95 L 86,83 A 27 27 0 1 1 86,47 Z" fill="url(#icon-c-grad)" />

    <!-- Inner Compass Needle (pointing North-East at 45 deg) -->
    <polygon points="68,65 92,41 78,57" fill="url(#icon-needle-blue)" />
    <polygon points="68,65 92,41 68,49" fill="#00B4FF" />
    <polygon points="68,65 44,89 58,73" fill="#FFFFFF" />
    <polygon points="68,65 44,89 68,81" fill="#E2E8F0" />

    <!-- Center Ring Pivot -->
    <circle cx="68" cy="65" r="7.5" fill="#0055EE" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="68" cy="65" r="3" fill="#FFFFFF" />
  </g>
</svg>
